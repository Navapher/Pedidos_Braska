<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pide a domicilio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#F9F0E1;--ink:#1B120B;--mute:#6f5f52;--card:#ffffff;--line:#e5d7bf;--red:#D4151C;--sun:#D4151C;--onred:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B120B;--ink:#F9F0E1;--mute:#b8a898;--card:#2a1d14;--line:#3d2c1f;--red:#D4151C;--price:#F9F0E1}}
:root[data-theme="dark"]{--bg:#1B120B;--ink:#F9F0E1;--mute:#b8a898;--card:#2a1d14;--line:#3d2c1f;--red:#D4151C;--price:#F9F0E1}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.hero{background:#1B120B;border-bottom:4px solid #D4151C;color:#F9F0E1;padding:36px 20px 28px;margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:calc(36px + env(safe-area-inset-top,0px))}
.hero h1{margin:0;font-size:clamp(2.6rem,12vw,4.6rem);line-height:.92;font-weight:800;letter-spacing:-.03em;color:#ffffff}
.hero p{margin:12px 0 0;font-weight:600;max-width:34ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
nav a{flex:none;text-decoration:none;color:var(--ink);border:1.5px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.92rem}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{max-width:680px;margin:0 auto;padding:0 16px}
section{padding-top:24px}
h2{font-size:1.6rem;margin:0 0 6px;letter-spacing:-.02em}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item b{display:block;font-weight:600}
.item small{color:var(--mute);display:block;max-width:34ch}
.price{font-weight:800;color:var(--price,var(--red));margin-top:2px}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button,.add{border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;cursor:pointer}
.qty button{width:36px;height:36px;font-size:1.2rem}
.qty span{min-width:1.2em;text-align:center;font-weight:800}
.add{padding:8px 16px}
#pedido{margin-top:40px;background:var(--card);border-radius:18px;padding:20px}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}
.opt{flex-direction:column;align-items:stretch}.opt .qty{width:100%}.opt select{flex:1;width:auto}.lq button{width:30px;height:30px}
.tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:800;font-size:1.15rem}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px}
.send{margin-top:18px;width:100%;border:0;border-radius:12px;background:var(--red);color:var(--onred);font:inherit;font-weight:800;font-size:1.1rem;padding:14px;cursor:pointer}
#err{color:var(--price,var(--red));font-weight:600;min-height:1.4em;margin:10px 0 0}
.empty{color:var(--mute)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar a{display:flex;justify-content:space-between;max-width:680px;margin:0 auto;background:var(--red);color:var(--onred);text-decoration:none;font-weight:800;border-radius:12px;padding:13px 16px}
footer{max-width:680px;margin:28px auto 0;padding:0 16px;color:var(--mute);font-size:.9rem}
.tex{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.tex-bg{opacity:.07}
.hero{position:relative;overflow:hidden}
.tex-hero{position:absolute;opacity:.2}
.hero>:not(.tex){position:relative}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tex-bg{filter:invert(1)}}
:root[data-theme="dark"] .tex-bg{filter:invert(1)}
.hero{text-align:center}.hero p{margin:12px auto 0}
.logo{display:block;width:clamp(150px,38vw,240px);height:auto;aspect-ratio:1;border-radius:50%;margin:0 auto;box-shadow:0 6px 0 rgba(27,18,11,.35)}
.hero>.herobg{position:absolute;top:0;bottom:0;width:50%;height:100%;object-fit:cover;object-position:30% 55%;opacity:.45}
.hb-l{left:0;transform:scaleX(-1)}.hb-r{right:0}
.tex-hero{filter:invert(1);opacity:.07}
footer{text-align:center}
.soc{display:flex;gap:12px;justify-content:center;margin:10px 0 14px}.soc a{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}.soc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.soc a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.loc{margin-top:8px;background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;font:inherit;font-weight:600;padding:9px 14px;cursor:pointer;width:100%}#locmsg{font-size:.9rem;color:var(--mute);margin:6px 0 0}
</style>
</head>

<script>
// ====== EDITA AQUÍ ======
const NOMBRE="BRASKA", WA="573208125504", DOMICILIO=4000;
const MENU=[
 {cat:"Hamburguesas",items:[["MANÁ","",25000],["METALICA","",29000],["AC/DC","",40000],["BLACK SABBATH","",40000]]},
 {cat:"Salchipapas",items:[["KURT COBAIN","",25000],["NIRVANA","",30000],["KISS","",35000],["SODA ESTEREO","",65000],["PINK FLOYD","",95000]]},
 {cat:"Qbanos",items:[["RATA BLANCA","",27000],["CAIFANES","",32000],["MAGO DE OZ","",38000]]},
 {cat:"Alas",items:[["N' ROSES","5 alas",20000],["IRON WINGS","8 alas",29000],["WINGLICA","18 alas",65000]]},
 {cat:"Costillas",items:[["MICHAEL RIBS","",20000],["OZZY RIBS","",40000]]},
 {cat:"Bebidas",items:[["Gaseosa personal","",5000,["Pepsi","Coca Cola","Postobón","Quatro","Jugo Hit","Agua con gas","Agua sin gas"]],["Gaseosa 1 litro","",8000,["Manzana","Colombiana","Uva","Coca Cola"]],["Gaseosa 1,5 litros","",10000,["Coca Cola","Manzana","Colombiana","Ginger"]],["Cerveza","",5000,["Águila","Poker","Sol","Heineken"]]]},
 {cat:"Adiciones",items:[["Papas con queso","Solo queso",5000],["Papas con tocineta","Mermelada de tocineta y doble porción de queso",10000],["Picado de pollo con carne","",5000]]}
];
// ========================
const fmt=n=>"$"+n.toLocaleString("es-CO"), $=id=>document.getElementById(id), cart={}, sel={};
document.title="Pedidos · "+NOMBRE;document.querySelectorAll(".herobg").forEach(i=>i.src=FOTO_HAMB);
$("nav").innerHTML=MENU.map((c,i)=>`<a href="#c${i}">${c.cat}</a>`).join("");
$("menu").innerHTML=MENU.map((c,ci)=>`<section id="c${ci}"><h2>${c.cat}</h2>`+c.items.map((it,ii)=>`
 <div class="item${it[3]?" opt":""}"><div><b>${it[0]}</b>${it[1]?`<small>${it[1]}</small>`:""}<div class="price">${fmt(it[2])}</div></div>
 <div class="qty" data-k="${ci}-${ii}"></div></div>`).join("")+`</section>`).join("");
const find=k=>{const[c,i,o]=k.split("-");const it=MENU[c].items[i];return{name:it[0]+(o!==undefined?" ("+it[3][o]+")":""),price:it[2]}};
function draw(){
 document.querySelectorAll(".qty:not(.lq)").forEach(el=>{const k0=el.dataset.k,it0=MENU[k0.split("-")[0]].items[k0.split("-")[1]];
  if(it0[3]){const s=sel[k0]||0;el.innerHTML=`<select data-s="${k0}" aria-label="Elegir opción">${it0[3].map((o,j)=>`<option value="${j}"${j===s?" selected":""}>${o}</option>`).join("")}</select><button class="add" data-o="${k0}">Agregar</button>`;return}
  const q=cart[k0]||0;
  el.innerHTML=q?`<button data-d="-1" aria-label="Quitar uno">−</button><span>${q}</span><button data-d="1" aria-label="Agregar uno">+</button>`:`<button class="add" data-d="1">Agregar</button>`});
 const ks=Object.keys(cart).filter(k=>cart[k]>0);let sub=0,n=0;
 const rows=ks.map(k=>{const f=find(k),q=cart[k];sub+=f.price*q;n+=q;return`<div class="line"><span>${f.name}</span><span class="qty lq" data-k="${k}"><button data-d="-1" aria-label="Quitar uno">−</button><span>${q}</span><button data-d="1" aria-label="Agregar uno">+</button></span><span>${fmt(f.price*q)}</span></div>`}).join("");
 $("lines").innerHTML=ks.length?rows+`<div class="line"><span>Domicilio</span><span>${fmt(DOMICILIO)}</span></div><div class="line tot"><span>Total</span><span>${fmt(sub+DOMICILIO)}</span></div>`:`<p class="empty">Aún no has agregado nada. Elige algo de la carta.</p>`;
 $("barlink").innerHTML=ks.length?`<span>Ver mi pedido (${n})</span><span>${fmt(sub+DOMICILIO)}</span>`:`<span>Ver mi pedido</span><span>Vacío</span>`;
 return{ks,sub};
}
document.addEventListener("click",e=>{const o=e.target.closest("button[data-o]");
 if(o){const k=o.dataset.o+"-"+(sel[o.dataset.o]||0);cart[k]=(cart[k]||0)+1;return draw()}
 const b=e.target.closest("button[data-d]");if(!b)return;
 const k=b.parentElement.dataset.k;cart[k]=Math.max(0,(cart[k]||0)+Number(b.dataset.d));draw()});
document.addEventListener("change",e=>{const s=e.target.closest("select[data-s]");if(s)sel[s.dataset.s]=Number(s.value)});
$("send").addEventListener("click",()=>{
 const{ks,sub}=draw(),v=id=>$(id).value.trim();
 if(!ks.length)return $("err").textContent="Agrega al menos un producto a tu pedido.";
 if(!v("nom")||!v("dir")||!v("tel"))return $("err").textContent="Completa tu nombre, dirección y teléfono.";
 $("err").textContent="";
 const txt=[`Hola, quiero hacer un pedido en ${NOMBRE}:`,"",...ks.map(k=>`${cart[k]} × ${find(k).name} (${fmt(find(k).price*cart[k])})`),"",
  `Subtotal: ${fmt(sub)}`,`Domicilio: ${fmt(DOMICILIO)}`,`Total: ${fmt(sub+DOMICILIO)}`,"",
  `Nombre: ${v("nom")}`,`Dirección: ${v("dir")}${v("bar2")?", barrio "+v("bar2"):""}`,...(ubic?[`Ubicación en el mapa: ${ubic}`]:[]),`Teléfono: ${v("tel")}`,`Pago: ${$("pago").value}`,
  ...(v("obs")?[`Observaciones: ${v("obs")}`]:[])].join("\n");
 const url="https://wa.me/"+WA+"?text="+encodeURIComponent(txt);
 const w=window.open(url,"_blank");if(!w)location.href=url;
});
let ubic="";
$("loc").addEventListener("click",()=>{const m=$("locmsg");
 if(!navigator.geolocation){m.textContent="Tu navegador no permite compartir la ubicación. Escribe tu dirección completa.";return}
 m.textContent="Buscando tu ubicación…";
 navigator.geolocation.getCurrentPosition(p=>{ubic="https://www.google.com/maps?q="+p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);m.textContent="Ubicación lista. Se enviará con tu pedido.";$("loc").textContent="Actualizar mi ubicación"},
  ()=>{ubic="";m.textContent="No pudimos obtener tu ubicación. Escribe bien tu dirección o compártela desde WhatsApp."},{enableHighAccuracy:true,timeout:15000});
});
draw();
</script>
</body>
</html>
